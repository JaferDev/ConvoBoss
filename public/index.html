<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="icon" href="sprites/icon.png">
        <meta charset="UTF-8">
        <title>ConvoBoss</title>
    </head>
    <body>
        <!-- LOGIN PAGE -->

        <div id="LoginPage">
            <div id="LoginCardContainer">
                <div id="LeftCard">
                    <div id="TopNavbar">
                        <img src="sprites/icon.png">
                        <p id="PageHead">ConvoBoss</p>
                    </div>
                </div>

                <div id="RightCard">
                    <p id="PageHead">LOG IN</p>
                    <div id="LoginContainer">
                        <input class="LongInput" id="username" type="text" placeholder="Username">
                        <input class="LongInput" id="password" type="password" placeholder="Password">
                        <button id="hlink" onclick="ChangePage(loginPage, registerPage)">Register Here</button>
                        <br>
                        <button class="LongButton" id="loginBtn">Log In</button>
                        <br>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- REGISTER PAGE -->
        <div id="RegisterPage">
            <div id="RegisterContainer">
                <div id="LeftCard">
                    <div id="TopNavbar">
                        <img src="sprites/icon.png">
                        <p id="PageHead">ConvoBoss</p>
                    </div>
                </div>

                <div id="RightCard">
                    <p id="PageHead">REGISTER</p>
                    <div id="LoginContainer">
                        <input class="LongInput" id="email" type="email" placeholder="Email (e.g: abc@xyz.com)" autofocus maxlength="64">
                        <input class="LongInput" id="username" type="text" placeholder="Username" maxlength="16">
                        <input class="LongInput" id="fullName" type="text" placeholder="Full Name" maxlength="64">
                        <input class="LongInput" id="dob" type="date" placeholder="Date of Birth" max="2020-01-01" min="1900-01-01">
                        <input class="LongInput" id="password" type="password" placeholder="Password" maxLength="16">
                        <input class="LongInput" id="confirmPassword" type="password" placeholder="Confirm Password" maxlength="16">
                        <div id="LabelInput">
                            <label class="LongInput">Profile Picture </label>
                            <input id="profilePic" type="file" name="Pfp">
                        </div>
                        <select class="LongInput" id="gender" name="Gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <button class="LongButton">REGISTER</button>

                        <p>Already have an account? <button id="hlink" onclick="ChangePage(registerPage, loginPage)">Login</button></p> 
                        
                    </div>
                </div> 
            </div>
        </div>

        <script src="js/frontend.js"></script>
    </body>
</html>
